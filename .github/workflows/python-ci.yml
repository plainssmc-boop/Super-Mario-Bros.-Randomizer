name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          git --version
          pwsh --version

      - name: Compile Python sources
        run: python -m compileall -q smb1_chaos_randomizer.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
